<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<title>Registration – Zero Ruppee Marketing Challenge</title>

<link rel="preload" href="fonts/Nexa-Book.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Nexa-Bold.ttf" as="font" type="font/ttf" crossorigin>

<style>
@font-face {
  font-family: "Nexa";
  src: url("fonts/Nexa-Book.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Nexa";
  src: url("fonts/Nexa-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Nexa";
  src: url("fonts/Nexa-Heavy.ttf") format("truetype");
  font-weight: 900;
  font-style: normal;
  font-display: swap;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --yellow: #e8ff00;
  --red: #ff1738;
  --green: #22c55e;
  --bg: #0a0a0d;
  --text-soft: #c9c9d1;
  --border: rgba(255, 255, 255, 0.12);
  --card: rgba(255, 255, 255, 0.04);
  --gutter: clamp(16px, 4vw, 48px);
}

html,
body {
  min-height: 100%;
  font-family: "Nexa", Arial, Helvetica, sans-serif;
  color: #ffffff;
  -webkit-font-smoothing: antialiased;
}

body {
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(130, 16, 44, 0.5), transparent 70%),
    linear-gradient(180deg, #160710 0%, var(--bg) 35%);
  background-color: var(--bg);
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

.header {
  padding: 24px var(--gutter);
  display: flex;
  justify-content: center;
}

.logo {
  width: clamp(140px, 16vw, 190px);
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px var(--gutter) 64px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(20px, 4vw, 32px);
}

.paid-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid rgba(34, 197, 94, .5);
  border-radius: 999px;
  background: rgba(34, 197, 94, .12);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  margin-bottom: 16px;
}

h1 {
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 8px;
}

.yellow {
  color: var(--yellow);
}

.lead {
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.payment-ref {
  list-style: none;
  border-top: 1px solid var(--border);
  margin-bottom: 24px;
}

.payment-ref li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.payment-ref li span:first-child {
  color: var(--text-soft);
}

.payment-ref li span:last-child {
  text-align: right;
  word-break: break-all;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(0, 0, 0, .35);
  color: #ffffff;
  font-family: inherit;
  font-size: 16px; /* 16px stops iOS from zooming in */
  transition: border-color .2s ease;
}

.field input:focus {
  outline: none;
  border-color: var(--yellow);
}

.field.has-error input {
  border-color: var(--red);
}

.field .error {
  display: none;
  margin-top: 6px;
  color: #ff6b7d;
  font-size: 13px;
}

.field.has-error .error {
  display: block;
}

.submit-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-top: 8px;
  padding: 16px 28px;
  border: 0;
  border-radius: 10px;
  background: var(--red);
  color: #ffffff;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 12px 28px -12px rgba(255, 23, 56, 0.8);
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 32px -12px rgba(255, 23, 56, 0.9);
}

.submit-btn[disabled] {
  opacity: .7;
  cursor: wait;
  transform: none;
}

.submit-btn:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 3px;
}

.form-error {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 23, 56, .5);
  border-radius: 10px;
  background: rgba(255, 23, 56, .1);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
}

.help {
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.6;
}

.help a {
  color: #ffffff;
  text-decoration: underline;
}
</style>
</head>
<body>

  <header class="header">
    <a href="/"><img class="logo" src="ZRM New LP Assets/Layer 1 2.png" alt="Tamil Business Tribe"></a>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="paid-badge">✔ PAYMENT VERIFIED</div>
      <h1>Complete Your <span class="yellow">Registration</span></h1>
      <p class="lead">Your payment is confirmed. Fill in your details so we can send you the Zoom link and updates.</p>

      <ul class="payment-ref" id="payment-ref" hidden>
        <li><span>Program</span><span id="ref-product"></span></li>
        <li><span>Amount paid</span><span id="ref-amount"></span></li>
        <li><span>Payment ID</span><span id="ref-payment"></span></li>
      </ul>

      <form id="reg-form" novalidate>
        <div class="field" data-field="fullName">
          <label for="fullName">Full Name *</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="80" required>
          <p class="error" id="fullName-error"></p>
        </div>

        <div class="field" data-field="mobile">
          <label for="mobile">Mobile Number *</label>
          <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="10-digit mobile number" required>
          <p class="error" id="mobile-error"></p>
        </div>

        <div class="field" data-field="email">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required>
          <p class="error" id="email-error"></p>
        </div>

        <div class="field" data-field="businessName">
          <label for="businessName">Business Name *</label>
          <input id="businessName" name="businessName" type="text" autocomplete="organization" maxlength="120" required>
          <p class="error" id="businessName-error"></p>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">Complete Registration →</button>
        <div class="form-error" id="form-error" role="alert" hidden></div>
      </form>
    </div>

    <p class="help">
      Need help? Call <a href="tel:+918015139542">+91 80151 39542</a><br>
      or email <a href="mailto:helpdesk@tamilbusinesstribe.com">helpdesk@tamilbusinesstribe.com</a>
    </p>
  </main>

<script>
(function () {
  var form = document.getElementById("reg-form");
  var btn = document.getElementById("submit-btn");
  var formError = document.getElementById("form-error");
  var BTN_LABEL = btn.textContent;
  var submitting = false;

  // same rules as the server (api/register.js)
  var rules = {
    fullName: function (v) { return v.trim().length >= 2 ? "" : "Please enter your full name."; },
    mobile: function (v) {
      var n = v.replace(/[\s-]/g, "").replace(/^(\+91|91|0)(?=\d{10}$)/, "");
      return /^[6-9]\d{9}$/.test(n) ? "" : "Please enter a valid 10-digit mobile number.";
    },
    email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "" : "Please enter a valid email address."; },
    businessName: function (v) { return v.trim().length >= 2 ? "" : "Please enter your business name."; }
  };

  function setError(name, message) {
    var field = form.querySelector('[data-field="' + name + '"]');
    var input = form.elements[name];
    field.classList.toggle("has-error", !!message);
    field.querySelector(".error").textContent = message || "";
    input.setAttribute("aria-invalid", message ? "true" : "false");
    if (message) input.setAttribute("aria-describedby", name + "-error");
  }

  function validate() {
    var firstBad = null;
    Object.keys(rules).forEach(function (name) {
      var message = rules[name](form.elements[name].value);
      setError(name, message);
      if (message && !firstBad) firstBad = form.elements[name];
    });
    if (firstBad) firstBad.focus();
    return !firstBad;
  }

  // re-check a field once the user fixes it
  Object.keys(rules).forEach(function (name) {
    form.elements[name].addEventListener("input", function () {
      if (form.querySelector('[data-field="' + name + '"]').classList.contains("has-error")) {
        setError(name, rules[name](form.elements[name].value));
      }
    });
  });

  function showFormError(text) {
    formError.hidden = !text;
    formError.textContent = text || "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (submitting) return; // double-click guard
    showFormError("");
    if (!validate()) return;

    submitting = true;
    btn.disabled = true;
    btn.textContent = "Submitting…";

    fetch("/api/register", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fullName: form.elements.fullName.value,
        mobile: form.elements.mobile.value,
        email: form.elements.email.value,
        businessName: form.elements.businessName.value
      })
    })
      .then(function (res) { return res.json().catch(function () { return {}; }); })
      .then(function (r) {
        if (r.ok) {
          window.location.replace(r.next || "/thank-you");
          return;
        }
        if (r.code === "no_payment") {
          window.location.replace("/payment");
          return;
        }
        if (r.fields) Object.keys(r.fields).forEach(function (n) { setError(n, r.fields[n]); });
        showFormError(r.error || "Something went wrong. Please try again.");
        submitting = false;
        btn.disabled = false;
        btn.textContent = BTN_LABEL;
      })
      .catch(function () {
        showFormError("Network problem – please check your connection and submit again. Your payment is safe.");
        submitting = false;
        btn.disabled = false;
        btn.textContent = BTN_LABEL;
      });
  });

  // mobile + email typed on the payment page (same tab) – saves retyping
  try {
    var contact = JSON.parse(sessionStorage.getItem("zrm_contact") || "null");
    if (contact) {
      if (!form.elements.mobile.value) form.elements.mobile.value = contact.mobile || "";
      if (!form.elements.email.value) form.elements.email.value = contact.email || "";
    }
  } catch (e) {}

  // payment reference (from the verified, signed session)
  fetch("/api/session", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (!s.paid) { window.location.replace("/payment"); return; }
      if (s.registered) { window.location.replace("/thank-you"); return; }
      document.getElementById("ref-product").textContent = s.product;
      document.getElementById("ref-amount").textContent = "₹" + (s.amount / 100);
      document.getElementById("ref-payment").textContent = s.paymentId;
      document.getElementById("payment-ref").hidden = false;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
